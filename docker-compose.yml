services:
  ollama:
    image: ollama/ollama:latest
    ports:
      # Optional host access for diagnostics; the CLI uses the private Compose network.
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    environment:
      # Keep only one resident Ollama model and serialize inference requests.
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  video-agent:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["cli"]
    working_dir: /workspace
    volumes:
      # Mount the Codespace workspace so input clips and output artifacts stay accessible.
      - .:/workspace
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5vl:3b}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      OLLAMA_MIN_MEMORY_GB: ${OLLAMA_MIN_MEMORY_GB:-}
      VIDEO_PLANNER_MODEL: ${VIDEO_PLANNER_MODEL:-qwen2.5:1.5b}
      VIDEO_PLANNER_MIN_MEMORY_GB: ${VIDEO_PLANNER_MIN_MEMORY_GB:-}
      WHISPER_MIN_MEMORY_GB: ${WHISPER_MIN_MEMORY_GB:-}
      WHISPER_MIN_VRAM_GB: ${WHISPER_MIN_VRAM_GB:-}
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama_data:
