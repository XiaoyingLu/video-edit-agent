services:
  ollama:
    image: ollama/ollama:latest
    ports:
      # Optional host access for diagnostics; the CLI uses the private Compose network.
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    environment:
      # Keep only one resident Ollama model and serialize inference requests.
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  web-api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "video_edit_agent.web_api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      VIDEO_PROJECTS_DIR: /workspace/projects
      OLLAMA_BASE_URL: http://ollama:11434

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - web-api

  video-agent:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["cli"]
    working_dir: /workspace
    volumes:
      # Mount the Codespace workspace so input clips and output artifacts stay accessible.
      - .:/workspace
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      SOUNDSTRIPE_API_KEY: ${SOUNDSTRIPE_API_KEY:-}
      STABILITY_API_KEY: ${STABILITY_API_KEY:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5vl:3b}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      OLLAMA_MIN_MEMORY_GB: ${OLLAMA_MIN_MEMORY_GB:-}
      VIDEO_PLANNER_MODEL: ${VIDEO_PLANNER_MODEL:-qwen2.5:1.5b}
      FOOTAGE_EMBEDDING_MODEL: ${FOOTAGE_EMBEDDING_MODEL:-}
      VIDEO_PLANNER_MIN_MEMORY_GB: ${VIDEO_PLANNER_MIN_MEMORY_GB:-}
      WHISPER_MIN_MEMORY_GB: ${WHISPER_MIN_MEMORY_GB:-}
      WHISPER_MIN_VRAM_GB: ${WHISPER_MIN_VRAM_GB:-}
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama_data:
  web_node_modules:
