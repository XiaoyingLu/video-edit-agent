services:
  ollama:
    image: ollama/ollama:latest
    ports:
      # Optional host access for diagnostics; the CLI uses the private Compose network.
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  video-agent:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["cli"]
    working_dir: /workspace
    volumes:
      # Mount the Codespace workspace so input clips and output artifacts stay accessible.
      - .:/workspace
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5vl:3b}
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama_data:
