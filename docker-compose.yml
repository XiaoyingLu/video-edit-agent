services:
  ollama:
    image: ollama/ollama:latest
    container_name: video-agent-ollama
    ports:
      # Keep the model API private to this machine/Codespace.
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  ollama_data:
