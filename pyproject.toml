[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "video-edit-agent"
version = "0.1.0"
description = "A local-first AI-assisted personal video editing CLI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Project contributors" }]
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "scenedetect[opencv]>=0.6.4,<0.8",
  # OpenCV 5 moved CascadeClassifier out of the main wheel; face reframing uses Haar cascades.
  "opencv-python>=4.8,<5",
  "numpy>=1.24,<3",
]

[project.optional-dependencies]
transcription = [
  "faster-whisper>=1.1,<2",
]
mlx = [
  "mlx-vlm>=0.1.0",
]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
  "mypy>=1.10,<3",
]

[project.scripts]
video-agent = "video_edit_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/video_edit_agent", "src/travel_video_agent"]
force-include = { "src/video_edit_agent/editing/templates/timeline_visual_review.html" = "video_edit_agent/editing/templates/timeline_visual_review.html" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_site_packages = true
follow_imports = "skip"
allow_untyped_defs = true
allow_incomplete_defs = true
no_strict_optional = true
disable_error_code = [
  "attr-defined",
  "arg-type",
  "assignment",
  "var-annotated",
  "misc",
  "str-bytes-safe",
]
