name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install FFmpeg for media smoke tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Audit dependencies
        run: pip-audit
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy src/video_edit_agent
      - name: Test with coverage
        run: >-
          pytest
          --cov=video_edit_agent
          --cov-report=term-missing
          --cov-fail-under=75
          --cov-report=xml:coverage-${{ matrix.python-version }}.xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage-${{ matrix.python-version }}.xml
          if-no-files-found: ignore

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build runtime image
        run: docker build --tag video-edit-agent:ci .
      - name: Verify runtime image excludes development tools
        run: >-
          docker run --rm --entrypoint python video-edit-agent:ci -c
          "import importlib.util; assert importlib.util.find_spec('pytest') is None;
          assert importlib.util.find_spec('ruff') is None"
      - name: Smoke-test runtime image
        run: docker run --rm video-edit-agent:ci --help
